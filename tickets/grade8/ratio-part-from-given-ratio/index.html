<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כרטיס כניסה – חישוב חלק מתוך יחס</title><style>:root{--b:#2457d6;--g:#0b7a53;--r:#b42318;--bg:#f5f7fb;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172033;line-height:1.55}.wrap{max-width:820px;margin:auto;padding:16px}header{background:linear-gradient(135deg,#173b8f,#3977ee);color:white;padding:22px;border-radius:18px;margin-bottom:14px}h1{font-size:1.55rem;margin:0 0 6px}h2{font-size:1.2rem}.sub{opacity:.95}.q,.panel{background:var(--card);padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 3px 14px #13213a12}.tag{display:inline-block;background:#e8efff;color:#173b8f;padding:3px 9px;border-radius:999px;font-weight:700;font-size:.85rem}label{font-weight:700;display:block;margin-top:12px}input,textarea{width:100%;border:1px solid #bdc7d8;border-radius:10px;padding:11px;font-size:1rem;margin-top:6px;background:#fff}textarea{min-height:74px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:11px;padding:10px 14px;font-size:1rem;font-weight:700;cursor:pointer;background:#e8eef9;color:#18345f}button.primary{background:var(--b);color:#fff;width:100%;padding:14px;margin-top:16px}.hint,.feedback,.solution{display:none;margin-top:10px;padding:10px;border-radius:10px}.hint{background:#fff7d6}.feedback.ok{display:block;background:#e8f7f0;color:#075b3e}.feedback.bad{display:block;background:#fff0ee;color:#8d1b12}.solution{background:#eef3ff}.score{font-size:1.25rem;font-weight:800;text-align:center;margin:14px}.follow{display:none}.follow h2{margin-bottom:4px}.mini{border-top:1px solid #e3e8f0;padding-top:13px;margin-top:13px}.mini:first-of-type{border-top:0}.checkone{background:#e9f1ff}.practice{border-right:5px solid #2b67db}.challenge{border-right:5px solid #8b4bd6}@media(min-width:700px){.wrap{padding:26px}.q{padding:22px}}</style></head><body><main class="wrap"><header><h1>כרטיס כניסה: חישוב חלק מתוך יחס נתון</h1><div class="sub">כיתה ח׳ · הקבצה א׳ · 3 שאלות · כ־3–5 דקות</div></header><section id="main"></section><button class="primary" onclick="submitMain()">הגש ובדוק</button><div id="score" class="score"></div><section id="practice" class="panel practice follow"><h2>תרגול נוסף באותה רמה</h2><div>3 שאלות חדשות. אפשר לפתור, לקבל רמז ולבדוק כל שאלה.</div><div id="practiceQs"></div></section><section id="challenge" class="panel challenge follow"><h2>אתגר נוסף</h2><div>3 שאלות מעט מורכבות יותר, עם אותם כלי עזר.</div><div id="challengeQs"></div></section></main><script>
const mainQs=[
{tag:'כניסה',q:'היחס בין מספר העפרונות הכחולים לאדומים הוא 3:5. יש 20 עפרונות אדומים. כמה עפרונות כחולים יש?',a:12,h:'התאם בין האיבר 5 ביחס לבין 20. באיזה גורם הוכפל 5?',f:'בדוק את סדר היחס: כחולים : אדומים = 3 : 5.',s:'5 חלקים מייצגים 20, לכן כל חלק הוא 4. מספר הכחולים: 3×4=12.'},
{tag:'יישום',q:'בקבוצת ספורט היחס בין בנים לבנות הוא 4:7. בקבוצה 33 תלמידים בסך הכול. כמה בנים יש?',a:12,h:'השלם מיוצג על ידי סכום איברי היחס. כמה חלקים יש יחד?',f:'כדי למצוא חלק מתוך השלם, קודם מצא כמה חלקי יחס יש בסך הכול.',s:'סה״כ חלקים: 4+7=11. כל חלק: 33÷11=3. בנים: 4×3=12.'},
{tag:'חשיבה',q:'בארגז היחס בין תפוחים לתפוזים הוא 5:3. בארגז 48 פירות בסך הכול. כמה תפוזים יש?',a:18,h:'השלם הוא 48. חבר את 5 ו־3 ואז מצא את ערכו של חלק אחד.',f:'שים לב: נשאלת על תפוזים, שהם האיבר השני ביחס.',s:'סה״כ חלקים: 5+3=8. כל חלק: 48÷8=6. תפוזים: 3×6=18.'}
];
function qHtml(x,i,p='m'){return `<article class="q"><span class="tag">${x.tag||'שאלה '+(i+1)}</span><h2>${x.q}</h2><label for="${p}work${i}">מקום לפתרון</label><textarea id="${p}work${i}" placeholder="כתבו כאן את דרך הפתרון..."></textarea><label for="${p}ans${i}">תשובה</label><input id="${p}ans${i}" inputmode="decimal" placeholder="הקלידו מספר"><div class="row"><button onclick="toggle('${p}hint${i}')">💡 רמז</button>${p==='m'?'':`<button class="checkone" onclick="checkOne('${p}',${i})">בדוק תשובה</button>`}</div><div id="${p}hint${i}" class="hint">${x.h}</div><div id="${p}fb${i}" class="feedback"></div><div id="${p}sol${i}" class="solution"><b>פתרון:</b> ${x.s}</div></article>`}
main.innerHTML=mainQs.map((x,i)=>qHtml(x,i)).join('');
function toggle(id){let e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}
function val(id){return Number(String(document.getElementById(id).value).trim().replace(',','.'))}
function mark(p,i,x,showSol=true){let fb=document.getElementById(`${p}fb${i}`),ok=val(`${p}ans${i}`)===x.a;fb.className='feedback '+(ok?'ok':'bad');fb.textContent=ok?'✓ נכון! דרך טובה לקשר בין היחס לכמות.':'✗ '+x.f;if(showSol)document.getElementById(`${p}sol${i}`).style.display='block';return ok}
function submitMain(){let n=0;mainQs.forEach((x,i)=>{if(mark('m',i,x))n++});score.textContent=`ניקוד: ${n} מתוך 3`;practice.style.display=challenge.style.display='block';practice.scrollIntoView({behavior:'smooth',block:'start'})}
const practice=[
{q:'היחס בין מחברות משובצות לחלקות הוא 2:5. יש 35 מחברות חלקות. כמה משובצות יש?',a:14,h:'5 חלקים מייצגים 35.',f:'שמור על הסדר: משובצות : חלקות.',s:'35÷5=7, ולכן 2×7=14.'},
{q:'היחס בין חולצות לבנות לכחולות הוא 3:4. יש 42 חולצות בסך הכול. כמה חולצות לבנות יש?',a:18,h:'חבר 3+4 כדי לייצג את השלם.',f:'מצא קודם את ערכו של חלק יחס אחד.',s:'3+4=7; 42÷7=6; 3×6=18.'},
{q:'היחס בין ספרי מדע לספרי סיפור הוא 5:7. יש 72 ספרים בסך הכול. כמה ספרי סיפור יש?',a:42,h:'השלם מחולק ל־12 חלקים.',f:'ספרי הסיפור מתאימים ל־7 חלקים.',s:'5+7=12; 72÷12=6; 7×6=42.'}
];
const challengeQsData=[
{q:'היחס בין חרוזים ירוקים לצהובים הוא 7:4. מספר הירוקים גדול ממספר הצהובים ב־18. כמה חרוזים צהובים יש?',a:24,h:'ההפרש בין איברי היחס הוא 3 חלקים.',f:'כאן 18 מייצג את ההפרש בין 7 חלקים ל־4 חלקים.',s:'7−4=3 חלקים; 18÷3=6 לכל חלק; צהובים: 4×6=24.'},
{q:'היחס בין תלמידים שהגיעו באוטובוס לבין תלמידים שהגיעו ברגל הוא 5:3. בסך הכול הגיעו 64 תלמידים. כמה הגיעו באוטובוס?',a:40,h:'השלם הוא 8 חלקי יחס.',f:'האוטובוס הוא האיבר הראשון, 5 חלקים.',s:'5+3=8; 64÷8=8; 5×8=40.'},
{q:'במועדון היחס בין מתחילים למתקדמים הוא 3:5. לאחר ש־6 מתחילים הצטרפו, יש 30 מתחילים. כמה מתקדמים היו לפני ההצטרפות?',a:40,h:'מצא קודם כמה מתחילים היו לפני שה־6 הצטרפו.',f:'היחס המקורי מתייחס למצב שלפני ההצטרפות.',s:'לפני ההצטרפות היו 30−6=24 מתחילים. 3 חלקים=24, לכן חלק=8, ומתקדמים: 5×8=40.'}
];
practiceQs.innerHTML=practice.map((x,i)=>qHtml(x,i,'p')).join('');challengeQs.innerHTML=challengeQsData.map((x,i)=>qHtml(x,i,'c')).join('');
function checkOne(p,i){let arr=p==='p'?practice:challengeQsData;mark(p,i,arr[i],true)}
</script></body></html>
