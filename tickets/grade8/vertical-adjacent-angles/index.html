<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>כרטיס כניסה – זוויות קודקודיות וצמודות</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#f4f7fb;color:#172033;font:16px Arial,sans-serif;line-height:1.55}.w{width:min(100% - 20px,760px);margin:auto;padding:16px 0 42px}h1{color:#174ea6;font-size:clamp(1.55rem,6vw,2.2rem);margin-bottom:4px}.sub{color:#56657a}.c{background:#fff;padding:18px;margin:14px 0;border-radius:16px;box-shadow:0 3px 14px #0001}.tag{display:inline-block;background:#e8f0fe;color:#174ea6;font-weight:700;padding:5px 10px;border-radius:999px}svg{width:100%;max-width:380px;display:block;margin:12px auto}input,button{width:100%;min-height:48px;font-size:16px;border-radius:10px}input{border:2px solid #ccd5e2;padding:10px}button{border:0;background:#e8f0fe;color:#174ea6;font-weight:700;margin-top:10px;cursor:pointer;touch-action:manipulation}.go{background:#174ea6;color:#fff}.h,.f,.s,.set{display:none;padding:11px;margin-top:10px;border-radius:9px}.h{background:#fff5cf}.s{background:#edf3ff;border-right:4px solid #174ea6}.ok{background:#e6f6ea;color:#176b35}.no{background:#fdeaea;color:#9c2525}.choices{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.choices button:last-child{background:#f1e8ff;color:#5c249d}@media(max-width:430px){.w{width:min(100% - 14px,760px)}.choices{grid-template-columns:1fr}}</style></head><body><main class="w"><h1>כרטיס כניסה</h1><p class="sub">זוויות קודקודיות וצמודות · כיתה ח׳ · הקבצה א׳ · 3–5 דקות</p><div id="base"></div><button class="go" onclick="check('base')">הגשה ובדיקת תשובות</button><div id="score"></div><div id="next" class="choices"><button onclick="openSet('same')">↻ תרגול נוסף באותה רמה</button><button onclick="openSet('hard')">🚀 אתגר נוסף</button></div><section id="same" class="set"><h2>תרגול נוסף באותה רמה</h2><div id="sameQ"></div><button class="go" onclick="check('same')">בדיקת התרגול</button></section><section id="hard" class="set"><h2>אתגר נוסף</h2><div id="hardQ"></div><button class="go" onclick="check('hard')">בדיקת האתגר</button></section></main><script>const sets={base:[['כניסה','באיור α = 70°. מה גודלה של β, הזווית הקודקודית ל־α?',70,'זוויות קודקודיות נמצאות זו מול זו ושוות בגודלן.','β = 70°, כי זוויות קודקודיות שוות.','vertical',70],['יישום','באיור α = 48°. מה גודלה של γ, הזווית הצמודה ל־α?',132,'זוויות צמודות חולקות שוק אחת, והשוקיים האחרות יוצרות קו ישר.','γ = 180° − 48° = 132°.','adjacent',48],['חשיבה','במשולש ABC נתון ∠A=52° ו־∠B=63°. הצלע BC מוארכת דרך C אל D. מצאו את הזווית החיצונית ∠ACD.',115,'מצאו תחילה את ∠C בעזרת סכום הזוויות במשולש, ואז השתמשו בזוויות צמודות.','∠C=180°−52°−63°=65°. לכן ∠ACD=180°−65°=115°.','triangle',0]],same:[['תרגול 1','α = 56°. מה גודלה של β הקודקודית לה?',56,'זוויות קודקודיות שוות.','β = 56°.','vertical',56],['תרגול 2','α = 125°. מה גודלה של γ הצמודה לה?',55,'זוויות צמודות על ישר משלימות ל־180°.','γ = 180° − 125° = 55°.','adjacent',125],['תרגול 3','במשולש נתונות שתי זוויות: 47° ו־68°. מה גודל הזווית השלישית?',65,'סכום זוויות במשולש הוא 180°.','180°−47°−68°=65°.','triangle2',0]],hard:[['אתגר 1','α ו־β קודקודיות: α=4x+6°, β=6x−30°. מצאו x.',18,'השוו בין הביטויים, כי הזוויות קודקודיות.','4x+6=6x−30, לכן x=18.','verticalExpr',0],['אתגר 2','α ו־γ צמודות: α=x+25°, γ=2x+5°. מצאו x.',50,'סכום הזוויות הצמודות הוא 180°.','x+25+2x+5=180, לכן x=50.','adjacentExpr',0],['אתגר 3','במשולש ABC: ∠A=x+10°, ∠B=2x°, והזווית החיצונית ב־C היא 120°. מצאו x.',30,'הזווית החיצונית שווה לסכום שתי הזוויות הפנימיות שאינן צמודות לה.','x+10+2x=120, לכן 3x=110? שימו לב: מכאן x=110/3, ולכן הנתונים אינם נותנים מספר שלם.','bad',0]]};sets.hard[2]=['אתגר 3','במשולש ABC: ∠A=x+10°, ∠B=2x+20°, והזווית החיצונית ב־C היא 120°. מצאו x.',30,'הזווית החיצונית שווה לסכום שתי הזוויות הפנימיות שאינן צמודות לה.','x+10+2x+20=120, לכן 3x=90 ומכאן x=30.','triangleExpr',0];function diagram(t,v){if(t==='triangle'||t==='triangle2'||t==='triangleExpr')return `<svg viewBox="0 0 360 220" role="img" aria-label="משולש עם זוויות מסומנות"><line x1="55" y1="175" x2="270" y2="175" stroke="#172033" stroke-width="4"/><line x1="270" y1="175" x2="335" y2="175" stroke="#172033" stroke-width="4"/><line x1="55" y1="175" x2="175" y2="35" stroke="#172033" stroke-width="4"/><line x1="175" y1="35" x2="270" y2="175" stroke="#172033" stroke-width="4"/><text x="42" y="198" font-size="17">B</text><text x="170" y="28" font-size="17">A</text><text x="267" y="198" font-size="17">C</text><text x="330" y="198" font-size="17">D</text>${t==='triangle'?'<text x="88" y="155" font-size="18">63°</text><text x="166" y="70" font-size="18">52°</text><text x="285" y="153" font-size="18" fill="#b3261e">?</text>':t==='triangle2'?'<text x="88" y="155" font-size="18">47°</text><text x="166" y="70" font-size="18">68°</text><text x="240" y="153" font-size="18" fill="#b3261e">?</text>':'<text x="83" y="153" font-size="17">2x+20°</text><text x="158" y="72" font-size="17">x+10°</text><text x="282" y="153" font-size="17" fill="#b3261e">120°</text>'}</svg>`;let labels=t.includes('Expr')?(t.startsWith('vertical')?['α=4x+6°','β=6x−30°']:['α=x+25°','γ=2x+5°']):[`α=${v}°`,t==='vertical'?'β':'γ'];let pos=t.startsWith('vertical')?`<text x="160" y="151" text-anchor="middle" font-size="18">${labels[1]}</text>`:`<text x="60" y="101" font-size="18">${labels[1]}</text>`;return `<svg viewBox="0 0 320 190" role="img" aria-label="שני ישרים נחתכים עם זוויות מסומנות"><line x1="35" y1="30" x2="285" y2="160" stroke="#172033" stroke-width="4"/><line x1="35" y1="160" x2="285" y2="30" stroke="#172033" stroke-width="4"/><path d="M126 77 A54 54 0 0 1 194 77" fill="#ffe0e0" stroke="#d33" stroke-width="2"/><text x="160" y="48" text-anchor="middle" font-size="18">${labels[0]}</text>${pos}</svg>`}function render(id,k){document.getElementById(id).innerHTML=sets[k].map((q,i)=>`<article class="c"><span class="tag">${i+1} · ${q[0]}</span><p>${q[1]}</p>${diagram(q[5],q[6])}<input id="${k}a${i}" type="number" inputmode="decimal" placeholder="הקלידו תשובה"><button onclick="document.getElementById('${k}h${i}').style.display='block'">💡 רמז</button><div class="h" id="${k}h${i}">${q[3]}</div><div class="f" id="${k}f${i}"></div><div class="s" id="${k}s${i}"><b>פתרון:</b> ${q[4]}</div></article>`).join('')}render('base','base');render('sameQ','same');render('hardQ','hard');function check(k){let n=0;sets[k].forEach((q,i)=>{let el=document.getElementById(k+'a'+i),ok=el.value.trim()!==''&&Math.abs(Number(el.value)-q[2])<1e-9,f=document.getElementById(k+'f'+i);if(ok)n++;f.textContent=ok?'✓ נכון.':'כדאי לבדוק שוב בעזרת הרמז.';f.className='f '+(ok?'ok':'no');f.style.display='block';document.getElementById(k+'s'+i).style.display='block'});if(k==='base'){score.className='c';score.textContent='הציון שלך: '+n+' מתוך 3';next.style.display='grid';score.scrollIntoView({behavior:'smooth',block:'center'})}}function openSet(k){document.getElementById(k).style.display='block';document.getElementById(k).scrollIntoView({behavior:'smooth'})}</script></body></html>
