<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>כרטיס כניסה – זוויות קודקודיות וצמודות</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#f4f7fb;color:#172033;font:16px Arial,sans-serif;line-height:1.55}.w{width:min(100% - 20px,760px);margin:auto;padding:16px 0 42px}h1{color:#174ea6;font-size:clamp(1.55rem,6vw,2.2rem);margin-bottom:4px}.sub{color:#56657a}.c{background:#fff;padding:18px;margin:14px 0;border-radius:16px;box-shadow:0 3px 14px #0001}.tag{display:inline-block;background:#e8f0fe;color:#174ea6;font-weight:700;padding:5px 10px;border-radius:999px}svg{width:100%;max-width:360px;display:block;margin:12px auto}input,button{width:100%;min-height:48px;font-size:16px;border-radius:10px}input{border:2px solid #ccd5e2;padding:10px}button{border:0;background:#e8f0fe;color:#174ea6;font-weight:700;margin-top:10px;cursor:pointer;touch-action:manipulation}.go{background:#174ea6;color:#fff}.h,.f,.s,.set{display:none;padding:11px;margin-top:10px;border-radius:9px}.h{background:#fff5cf}.s{background:#edf3ff;border-right:4px solid #174ea6}.ok{background:#e6f6ea;color:#176b35}.no{background:#fdeaea;color:#9c2525}.choices{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.choices button:last-child{background:#f1e8ff;color:#5c249d}@media(max-width:430px){.w{width:min(100% - 14px,760px)}.choices{grid-template-columns:1fr}}</style></head><body><main class="w"><h1>כרטיס כניסה</h1><p class="sub">זוויות קודקודיות וצמודות · כיתה ח׳ · 3–5 דקות</p><div id="base"></div><button class="go" onclick="check('base')">הגשה ובדיקת תשובות</button><div id="score"></div><div id="next" class="choices"><button onclick="openSet('same')">↻ תרגול נוסף באותה רמה</button><button onclick="openSet('hard')">🚀 אתגר נוסף</button></div><section id="same" class="set"><h2>תרגול נוסף באותה רמה</h2><div id="sameQ"></div><button class="go" onclick="check('same')">בדיקת התרגול</button></section><section id="hard" class="set"><h2>אתגר נוסף</h2><div id="hardQ"></div><button class="go" onclick="check('hard')">בדיקת האתגר</button></section></main><script>const sets={base:[['כניסה','באיור α = 70°. מה גודלה של β, הזווית הקודקודית ל־α?',70,'זוויות קודקודיות נמצאות זו מול זו ושוות בגודלן.','β = 70°, כי זוויות קודקודיות שוות.',70,'β'],['יישום','באיור α = 48°. מה גודלה של γ, הזווית הצמודה ל־α?',132,'זוויות צמודות היוצרות קו ישר משלימות ל־180°.','γ = 180° − 48° = 132°.',48,'γ'],['חשיבה','α ו־γ צמודות. α = 3x+20° ו־γ = 2x−10°. מצאו את x.',34,'כתבו משוואה שבה סכום שתי הזוויות הוא 180°.','3x+20+2x−10=180, ולכן 5x=170 ומכאן x=34.','3x+20°','2x−10°']],same:[['תרגול 1','α = 56°. מה גודלה של β הקודקודית לה?',56,'זוויות קודקודיות שוות.','β = 56°.',56,'β'],['תרגול 2','α = 125°. מה גודלה של γ הצמודה לה?',55,'חסרו את α מ־180°.','γ = 180° − 125° = 55°.',125,'γ'],['תרגול 3','γ = 98°. מה גודלה של β הצמודה לה?',82,'זוויות צמודות על ישר משלימות ל־180°.','β = 180° − 98° = 82°.',98,'β']],hard:[['אתגר 1','α ו־β קודקודיות: α=4x+6°, β=6x−30°. מצאו x.',18,'השוו בין הביטויים, כי הזוויות קודקודיות.','4x+6=6x−30, לכן 36=2x ומכאן x=18.','4x+6°','6x−30°'],['אתגר 2','α ו־γ צמודות: α=x+25°, γ=2x+5°. מצאו x.',50,'סכום הזוויות הצמודות הוא 180°.','x+25+2x+5=180, לכן 3x=150 ומכאן x=50.','x+25°','2x+5°'],['אתגר 3','α ו־β קודקודיות: α=3x−4°, β=2x+26°. מצאו את גודל α.',86,'מצאו תחילה את x בעזרת שוויון הזוויות.','3x−4=2x+26, לכן x=30, ולכן α=86°.','3x−4°','2x+26°']]};function pic(a,b){return `<svg viewBox="0 0 320 190" role="img" aria-label="שני ישרים נחתכים עם זוויות מסומנות"><line x1="35" y1="30" x2="285" y2="160" stroke="#172033" stroke-width="4"/><line x1="35" y1="160" x2="285" y2="30" stroke="#172033" stroke-width="4"/><path d="M126 77 A54 54 0 0 1 194 77" fill="#ffe0e0" stroke="#d33" stroke-width="2"/><path d="M126 113 A54 54 0 0 0 194 113" fill="#dcecff" stroke="#2670d8" stroke-width="2"/><text x="160" y="48" text-anchor="middle" font-size="18">α = ${a}</text><text x="160" y="151" text-anchor="middle" font-size="18">${b}</text><text x="57" y="101" font-size="17">γ</text></svg>`}function render(id,k){document.getElementById(id).innerHTML=sets[k].map((q,i)=>`<article class="c"><span class="tag">${i+1} · ${q[0]}</span><p>${q[1]}</p>${pic(q[5],q[6])}<input id="${k}a${i}" type="number" inputmode="decimal" placeholder="הקלידו תשובה" aria-label="תשובה לשאלה ${i+1}"><button onclick="document.getElementById('${k}h${i}').style.display='block'">💡 רמז</button><div class="h" id="${k}h${i}">${q[3]}</div><div class="f" id="${k}f${i}"></div><div class="s" id="${k}s${i}"><b>פתרון:</b> ${q[4]}</div></article>`).join('')}render('base','base');render('sameQ','same');render('hardQ','hard');function check(k){let n=0;sets[k].forEach((q,i)=>{const el=document.getElementById(k+'a'+i),ok=el.value.trim()!==''&&Number(el.value)===q[2],f=document.getElementById(k+'f'+i);if(ok)n++;f.textContent=ok?'✓ נכון.':'כדאי לבדוק שוב בעזרת הרמז.';f.className='f '+(ok?'ok':'no');f.style.display='block';document.getElementById(k+'s'+i).style.display='block'});if(k==='base'){const sc=document.getElementById('score');sc.className='c';sc.textContent='הציון שלך: '+n+' מתוך 3';document.getElementById('next').style.display='grid';sc.scrollIntoView({behavior:'smooth',block:'center'})}}function openSet(k){document.getElementById(k).style.display='block';document.getElementById(k).scrollIntoView({behavior:'smooth'})}</script></body></html>
